name: Build (PR)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Write untracked build info
        run: node scripts/write-build-info.mjs --untracked

      - name: Install
        run: npm install

      - name: Build web
        run: npm run build:web --workspace=@megacrow/ide

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: megacrow-web-pr
          path: packages/ide/dist

  tauri:
    name: Tauri (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/ide/src-tauri -> target

      - name: Write untracked build info
        run: node scripts/write-build-info.mjs --untracked

      - name: Install
        run: npm install

      # npm optional-deps bug: Windows lockfiles omit foreign platform binaries.
      - name: Ensure Tauri CLI native binding
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos-latest) BINDING="@tauri-apps/cli-darwin-arm64" ;;
            ubuntu-22.04) BINDING="@tauri-apps/cli-linux-x64-gnu" ;;
            windows-latest) BINDING="@tauri-apps/cli-win32-x64-msvc" ;;
            *)
              echo "Unhandled platform: ${{ matrix.platform }}"
              exit 1
              ;;
          esac
          npm install "@tauri-apps/cli@2.11.2" "${BINDING}@2.11.2" --no-save --force
          node -e "require('@tauri-apps/cli')"
          npm run tauri --workspace=@megacrow/ide -- --version
          echo "Tauri CLI native binding OK (${BINDING})"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/ide
          uploadUpdaterJson: false

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megacrow-tauri-pr-${{ matrix.platform }}
          path: |
            packages/ide/src-tauri/target/release/bundle
            packages/ide/src-tauri/target/release/*.exe
            packages/ide/src-tauri/target/release/*.app
          if-no-files-found: warn

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Write untracked build info
        run: node scripts/write-build-info.mjs --untracked

      - name: Install
        run: npm install

      - name: Package VSIX
        run: npm run package --workspace=megaloevolved

      - name: Verify build string in bundles
        shell: bash
        run: |
          set -euo pipefail
          BUILD_STRING='untracked version'
          for bundle in packages/vscode-extension/dist/server.js packages/vscode-extension/README.md; do
            if ! grep -F "$BUILD_STRING" "$bundle" >/dev/null; then
              echo "Missing build string in $bundle"
              exit 1
            fi
            echo "OK: $bundle contains $BUILD_STRING"
          done

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: megaloevolved-vscode-extension-pr
          path: packages/vscode-extension/megaloevolved-*.vsix
