name: Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare build string
    runs-on: ubuntu-latest
    outputs:
      build_string: ${{ steps.compute.outputs.build_string }}
      build_info_json: ${{ steps.compute.outputs.build_info_json }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute build string
        id: compute
        shell: bash
        env:
          MEGACROW_BRANCH: ${{ github.ref_name }}
          MEGACROW_SEQ: ${{ github.run_number }}
        run: |
          INFO=$(node scripts/compute-build-string.mjs)
          {
            echo "build_info_json<<EOF"
            echo "$INFO"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          BUILD_STRING=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).buildString)" "$INFO")
          echo "build_string=$BUILD_STRING" >> "$GITHUB_OUTPUT"
          echo "Computed build string: $BUILD_STRING"

  web:
    name: Web bundle
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Write build info
        run: node scripts/write-build-info.mjs --from-json '${{ needs.prepare.outputs.build_info_json }}'

      - name: Install
        run: npm install

      - name: Build web
        env:
          # Relative base so the same artifact works at Pages root and /<branch>/.
          MEGACROW_BASE: ./
        run: npm run build:web --workspace=@megacrow/ide

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: megacrow-web
          path: packages/ide/dist
          retention-days: 90

  pages:
    name: Deploy Pages preview
    needs: web
    if: >
      success() &&
      github.ref != 'refs/heads/gh-pages' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Resolve destination
        id: target
        shell: bash
        run: |
          set -euo pipefail
          destination='${{ github.ref_name }}'
          case "$destination" in
            docs|assets|gh-pages|.github|"")
              echo "Branch name '$destination' is reserved or empty."
              exit 1
              ;;
          esac
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "Deploying Pages preview to /$destination/"

      - name: Download megacrow-web
        uses: actions/download-artifact@v4
        with:
          name: megacrow-web
          path: dist

      - name: Verify dist
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            echo "megacrow-web artifact is missing index.html"
            find dist -maxdepth 3 -type f | head -n 50 || true
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ steps.target.outputs.destination }}
          keep_files: true
          force_orphan: false

  tauri:
    name: Tauri (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/ide/src-tauri -> target

      - name: Write build info
        shell: bash
        run: node scripts/write-build-info.mjs --from-json '${{ needs.prepare.outputs.build_info_json }}'

      - name: Install
        run: npm install

      - name: Ensure Tauri CLI native binding
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos-latest) BINDING="@tauri-apps/cli-darwin-arm64" ;;
            ubuntu-22.04) BINDING="@tauri-apps/cli-linux-x64-gnu" ;;
            windows-latest) BINDING="@tauri-apps/cli-win32-x64-msvc" ;;
            *)
              echo "Unhandled platform: ${{ matrix.platform }}"
              exit 1
              ;;
          esac
          npm install "@tauri-apps/cli@2.11.2" "${BINDING}@2.11.2" --no-save --force
          node -e "require('@tauri-apps/cli')"
          npm run tauri --workspace=@megacrow/ide -- --version
          echo "Tauri CLI native binding OK (${BINDING})"

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/ide
          uploadUpdaterJson: false

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: megacrow-tauri-${{ matrix.platform }}
          path: |
            packages/ide/src-tauri/target/release/bundle
            packages/ide/src-tauri/target/release/*.exe
            packages/ide/src-tauri/target/release/*.app
          if-no-files-found: warn

  vscode-extension:
    name: VS Code extension
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Write build info
        run: node scripts/write-build-info.mjs --from-json '${{ needs.prepare.outputs.build_info_json }}'

      - name: Install
        run: npm install

      - name: Package VSIX
        run: npm run package --workspace=megaloevolved

      - name: Verify build string in bundles
        shell: bash
        run: |
          set -euo pipefail
          BUILD_STRING='${{ needs.prepare.outputs.build_string }}'
          if [[ -z "$BUILD_STRING" || "$BUILD_STRING" == "untracked version" ]]; then
            echo "Expected a tracked CI build string, got: ${BUILD_STRING:-<empty>}"
            exit 1
          fi
          for bundle in packages/vscode-extension/dist/server.js packages/vscode-extension/README.md; do
            if ! grep -F "$BUILD_STRING" "$bundle" >/dev/null; then
              echo "Missing build string in $bundle"
              exit 1
            fi
            echo "OK: $bundle contains $BUILD_STRING"
          done
          SEQ=$((10#${BUILD_STRING%%.*}))
          EXPECTED_VERSION="0.${SEQ}.0"
          PKG_VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")
          if [[ "$PKG_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Expected extension version $EXPECTED_VERSION, got $PKG_VERSION"
            exit 1
          fi
          VSIX=$(ls packages/vscode-extension/megaloevolved-${EXPECTED_VERSION}.vsix | head -n 1)
          echo "Packaged $VSIX ($EXPECTED_VERSION)"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: megaloevolved-vscode-extension
          path: packages/vscode-extension/megaloevolved-*.vsix
          retention-days: 90

  tag:
    name: Tag build
    needs: [prepare, web, tauri, vscode-extension]
    # Tag even when web/tauri/extension fail — seq is github.run_number and must advance.
    if: always() && needs.prepare.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Create build tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG='${{ needs.prepare.outputs.build_string }}'
          SHA='${{ github.sha }}'
          if [[ -z "$TAG" || "$TAG" == "untracked version" ]]; then
            echo "Refusing to tag untracked build"
            exit 1
          fi

          if gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi

          TAG_OBJECT=$(gh api "repos/${{ github.repository }}/git/tags" \
            -f tag="$TAG" \
            -f message="Build $TAG" \
            -f object="$SHA" \
            -f type=commit)
          TAG_SHA=$(printf '%s' "$TAG_OBJECT" | jq -r .sha)

          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$TAG_SHA"
