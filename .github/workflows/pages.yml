# Publish MegaCrow web to GitHub Pages (no app rebuild).
#
# Branch previews are deployed from the Build workflow after megaloevolved-web uploads.
# This workflow covers:
#   - Full (non-prerelease) GitHub Release → site root (/)
#   - Branch deletion → remove /<branch>/
#   - Manual workflow_dispatch → redeploy from an existing Build artifact
#
# Layout (https://<owner>.github.io/<repo>/):
#   /              ← full release only (prereleases do not deploy here)
#   /<branch>/     ← branch preview (from Build)
#
# Setup (once):
#   Repo Settings → Pages → Source: Deploy from a branch → gh-pages / (root)

name: GitHub Pages

on:
  delete:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        type: choice
        options:
          - auto
          - root
          - branch
        default: auto
      tag:
        description: "Release tag (required when target is root)"
        required: false
        type: string
      branch:
        description: "Branch name (optional when target is branch; default: this ref)"
        required: false
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    name: Fetch Build artifact
    if: |
      (github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      destination: ${{ steps.target.outputs.destination }}
    steps:
      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          INPUT_TARGET='${{ github.event.inputs.target || 'auto' }}'
          INPUT_BRANCH='${{ github.event.inputs.branch || '' }}'
          INPUT_TAG='${{ github.event.inputs.tag || '' }}'
          RELEASE_TAG='${{ github.event.release.tag_name || '' }}'
          REF_NAME='${{ github.ref_name }}'

          mode=
          destination=
          tag=
          branch=

          if [[ "$EVENT" == "release" ]] || [[ "$INPUT_TARGET" == "root" ]]; then
            mode=root
            tag="${RELEASE_TAG:-$INPUT_TAG}"
          elif [[ "$INPUT_TARGET" == "branch" ]] || [[ "$INPUT_TARGET" == "auto" ]]; then
            mode=branch
            branch="${INPUT_BRANCH:-$REF_NAME}"
          else
            echo "Unhandled event/target combination"
            exit 1
          fi

          if [[ "$mode" == "branch" ]]; then
            case "$branch" in
              docs|assets|gh-pages|.github|"")
                echo "Branch name '$branch' is reserved or empty."
                exit 1
                ;;
            esac
            destination="$branch"
          fi

          {
            echo "mode=$mode"
            echo "destination=$destination"
            echo "tag=$tag"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode destination=${destination:-'(root)'} tag=${tag:-'-'} branch=${branch:-'-'}"

      - name: Check out rewrite script
        if: steps.target.outputs.mode == 'root'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/rewrite-docs-base.mjs
          sparse-checkout-cone-mode: false

      - name: Download megaloevolved-web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.target.outputs.mode }}
          TAG: ${{ steps.target.outputs.tag }}
          BRANCH: ${{ steps.target.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=

          if [[ "$MODE" == "root" ]]; then
            if [[ -z "${TAG:-}" ]]; then
              echo "No release tag provided. For workflow_dispatch with target=root, set the tag input."
              exit 1
            fi
            echo "Resolving commit for tag: $TAG"
            REF_JSON=$(gh api "repos/${REPO}/git/ref/tags/${TAG}")
            OBJECT_TYPE=$(printf '%s' "$REF_JSON" | jq -r .object.type)
            OBJECT_SHA=$(printf '%s' "$REF_JSON" | jq -r .object.sha)
            if [[ "$OBJECT_TYPE" == "tag" ]]; then
              COMMIT_SHA=$(gh api "repos/${REPO}/git/tags/${OBJECT_SHA}" --jq .object.sha)
            else
              COMMIT_SHA="$OBJECT_SHA"
            fi
            echo "Tag $TAG → commit $COMMIT_SHA"
            RUN_ID=$(gh run list \
              --repo "$REPO" \
              --workflow build.yml \
              --commit "$COMMIT_SHA" \
              --status completed \
              --limit 30 \
              --json databaseId,conclusion,createdAt \
              --jq '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')
          else
            echo "Finding latest successful Build for branch: $BRANCH"
            RUN_ID=$(gh run list \
              --repo "$REPO" \
              --workflow build.yml \
              --branch "$BRANCH" \
              --status completed \
              --limit 30 \
              --json databaseId,conclusion,createdAt \
              --jq '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')
          fi

          if [[ -z "$RUN_ID" ]]; then
            echo "No successful Build workflow run found for this deploy."
            exit 1
          fi
          echo "Using Build run id: $RUN_ID"

          mkdir -p dist
          # Builds before the rename uploaded the web dist as 'megacrow-web'.
          if ! gh run download "$RUN_ID" --repo "$REPO" --name megaloevolved-web --dir dist; then
            echo "No 'megaloevolved-web' artifact in run $RUN_ID; trying legacy 'megacrow-web'."
            rm -rf dist && mkdir -p dist
            if ! gh run download "$RUN_ID" --repo "$REPO" --name megacrow-web --dir dist; then
              echo "Failed to download web artifact from run $RUN_ID."
              exit 1
            fi
          fi

      - name: Verify dist
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            echo "megaloevolved-web artifact is missing index.html"
            find dist -maxdepth 3 -type f | head -n 50 || true
            exit 1
          fi
          echo "Fetched megaloevolved-web ($(du -sh dist | cut -f1))"

      - name: Rewrite docs base for release root
        if: steps.target.outputs.mode == 'root'
        env:
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="${REPO##*/}"
          if [[ ! -d dist/docs ]]; then
            echo "No dist/docs to rewrite"
            exit 0
          fi
          node scripts/rewrite-docs-base.mjs \
            --dir dist/docs \
            --base "/${REPO_NAME}/docs/"

      - name: Upload dist for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: megacrow-pages-dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: megacrow-pages-dist
          path: dist

      - name: Deploy branch preview
        if: needs.fetch.outputs.mode == 'branch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: ${{ needs.fetch.outputs.destination }}
          keep_files: true
          force_orphan: false

      - name: Deploy release root
        if: needs.fetch.outputs.mode == 'root'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          keep_files: true
          force_orphan: false

  cleanup-branch:
    name: Cleanup deleted branch
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true

      - name: Remove branch path
        id: remove
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='${{ github.event.ref }}'
          case "$BRANCH" in
            docs|assets|gh-pages|.github|"")
              echo "Skipping cleanup for reserved or empty ref: '$BRANCH'"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ ! -d site ]]; then
            echo "gh-pages branch does not exist yet; nothing to clean."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -e "site/$BRANCH" ]]; then
            echo "No Pages path for deleted branch '$BRANCH'."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Removing site/$BRANCH"
          rm -rf "site/$BRANCH"
          parent=$(dirname "$BRANCH")
          while [[ "$parent" != "." && "$parent" != "/" ]]; do
            if [[ -d "site/$parent" ]] && [[ -z "$(ls -A "site/$parent")" ]]; then
              rmdir "site/$parent"
              parent=$(dirname "$parent")
            else
              break
            fi
          done

          rm -rf site/.git
          touch site/.nojekyll
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Publish cleaned site
        if: steps.remove.outputs.should_deploy == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: false
          keep_files: false
